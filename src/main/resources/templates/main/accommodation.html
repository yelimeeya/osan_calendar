<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숙소 예약 관리</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        #grid {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .card {
            margin: 20px;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .grid-container {
            flex: 1;
            min-height: 0;
        }

    </style>
</head>
<body>
    <div layout:fragment="content" class="container-fluid h-100">
        <div class="card h-100">
            <div class="card-header">
                <h4 class="mb-0">숙소 예약 현황</h4>
            </div>
            <div class="card-body">
                <div id="currentMonth" class="mb-3 text-center fw-bold fs-5"></div>
                <div class="grid-container">
                    <div id="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gridElement = document.getElementById('grid');

            const columns = [
                { header: '가예약', name: 'reservation', width: 60, align: 'center' },
                { header: '회사명', name: 'company', width: 150, sortable: true },
                { header: '과정명', name: 'course', width: 250, sortable: true },
                { header: '구분', name: 'type', width: 100, align: 'center', sortable: true },
                { header: '실인원', name: 'actualCount', width: 70, align: 'center', sortable: true },
                { header: '연인원', name: 'totalCount', width: 70, align: 'center', sortable: true }
            ];

            // 1일부터 31일까지의 컬럼 추가
            for (let day = 1; day <= 31; day++) {
                columns.push(
                    {
                        header: `${day}일<br>1인실`,
                        name: `day${day}Single`,
                        width: 60,
                        align: 'center',
                        template: (value) => value || '0'
                    },
                    {
                        header: `${day}일<br>2인실`,
                        name: `day${day}Double`,
                        width: 60,
                        align: 'center',
                        template: (value) => value || '0'
                    },
                    {
                        header: `${day}일<br>특화`,
                        name: `day${day}Special`,
                        width: 60,
                        align: 'center',
                        template: (value) => value || '0'
                    }
                );
            }

            const dataSource = {
                api: {
                    readData: { url: '/api/accommodation/data', method: 'GET' }
                }
            };

            // 그리드 초기화
            const grid = new tui.Grid({
                el: gridElement,
                data: dataSource,
                scrollX: true,
                scrollY: true,
                bodyHeight: 'auto',
                rowHeaders: ['rowNum'],
                columns: columns
            });

            // 현재 월 표시
            const now = new Date();
            document.getElementById('currentMonth').textContent =  `${now.getFullYear()}년 ${now.getMonth() + 1}월`;

        });
    </script>
</body>
</html>
